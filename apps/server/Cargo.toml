[package]
name = "euchre-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "euchre-server"
path = "src/main.rs"

[dependencies]
euchre-server-core.workspace = true
euchre-table.workspace = true
euchre-ai-seat.workspace = true
euchre-profile.workspace = true
euchre-http.workspace = true
rivetkit.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
reqwest.workspace = true
parking_lot.workspace = true

# Free-disk check before the engine starts (statvfs without `unsafe`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
rivetkit-client.workspace = true
tempfile.workspace = true
tower.workspace = true
http.workspace = true

[lints]
workspace = true
