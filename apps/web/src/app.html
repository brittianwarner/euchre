<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Every path gets this shell (the SPA fallback, D4), so these are the tags
			link previews and crawlers see. Pages set their own title once they run.
		-->
		<title>Euchre</title>
		<meta
			name="description"
			content="Classic four-player euchre against computer opponents, in your browser or on your desktop."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Euchre" />
		<meta property="og:title" content="Euchre" />
		<meta
			property="og:description"
			content="Classic four-player euchre against computer opponents, in your browser or on your desktop."
		/>
		<meta property="og:image" content="https://euchre.sh/art/euchre-og.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Classic playing cards and a dealer button on a green felt table"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Euchre" />
		<meta
			name="twitter:description"
			content="Classic four-player euchre against computer opponents, in your browser or on your desktop."
		/>
		<meta name="twitter:image" content="https://euchre.sh/art/euchre-og.jpg" />
		<meta
			name="twitter:image:alt"
			content="Classic playing cards and a dealer button on a green felt table"
		/>
		<!--
			The web fonts. The stylesheet itself is added by the root layout, so a slow
			fonts.googleapis.com never holds back the first paint; the preload starts
			the fetch with the first byte. Without JavaScript the noscript link loads it.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;550;600;650;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;550;600;650;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
			/>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<!-- The home page for visitors without JavaScript (src/routes/+page.svelte). -->
			<style>
				body {
					margin: 0;
					background: #305342;
				}
				.nojs {
					box-sizing: border-box;
					min-height: 100vh;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					gap: 20px;
					padding: 32px 16px;
					text-align: center;
					color: #f4f3e9;
					font-family:
						'DM Sans',
						-apple-system,
						BlinkMacSystemFont,
						'Segoe UI',
						sans-serif;
				}
				.nojs h1 {
					margin: 0;
					font:
						600 56px/1 'Source Serif 4',
						Georgia,
						serif;
					letter-spacing: -0.07em;
				}
				.nojs h1 span {
					font-size: 0.62em;
					margin-left: 0.14em;
					letter-spacing: 0;
					color: #d4ed9b;
				}
				.nojs img {
					width: min(100%, 640px);
					height: auto;
					/* The same oval feather as the home page, into the same felt. */
					mask-image: radial-gradient(ellipse 52% 51% at 48% 49%, #000 86%, transparent 100%);
				}
				.nojs .play {
					display: inline-flex;
					align-items: center;
					justify-content: center;
					width: min(100%, 15rem);
					height: 52px;
					border-radius: 10px;
					background: #d4ed9b;
					color: #153f36;
					font-weight: 650;
					text-decoration: none;
				}
				.nojs p {
					margin: 0;
					max-width: 34rem;
					text-wrap: balance;
					font-size: 14px;
					line-height: 21px;
					color: #b9cabd;
				}
				.nojs p a {
					color: #f4f3e9;
				}
			</style>
			<main class="nojs">
				<h1>euchre<span aria-hidden="true">♣</span></h1>
				<img
					src="/art/euchre-hero.webp"
					width="1200"
					height="1000"
					alt="Classic playing cards and a dealer button on a green felt table, with both red jacks at the front"
				/>
				<a class="play" href="/new">Play now</a>
				<p>
					Playing in the browser needs JavaScript. Or download Euchre for
					<a href="/download/mac">Mac</a>, <a href="/download/windows">Windows</a> or
					<a href="/download/linux">Linux</a>.
				</p>
			</main>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
