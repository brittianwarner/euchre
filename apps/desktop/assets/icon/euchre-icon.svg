<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Euchre app icon (Windows and Linux: 960 px body, 32 px margin). Felt colours from
       apps/desktop/src/theme/felt.rs (FELT_HI, FELT_CENTER, FELT_EDGE, FELT_RIM, FELT_TEXT);
       the club is the SCA pip of apps/web/static/art/cards/AC.svg. -->
  <defs>
    <radialGradient id="felt" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#2d6b56"/>
      <stop offset="0.55" stop-color="#245a49"/>
      <stop offset="1" stop-color="#10382c"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#felt)"/>
  <rect x="72" y="72" width="880" height="880" rx="164" fill="none" stroke="#dae6b0" stroke-opacity="0.22" stroke-width="6"/>
  <g transform="translate(512 512) scale(0.58)">
