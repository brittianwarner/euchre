[package]
name = "euchre-ai"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The euchre AI: heuristic, rollouts, the Jev decision client, banter streaming, the aiSeat ladder and handlers (port of src/lib/ai and src/lib/actors/ai-seat)."

[dependencies]
euchre-engine.workspace = true
euchre-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
subtle.workspace = true
bytes.workspace = true

# tokio (`full`) and reqwest's native stack do not build for wasm32. The browser build of the
# desktop app only needs the heuristic, and the modules that use these are native-only (lib.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
reqwest.workspace = true

[dev-dependencies]
sha2.workspace = true
hex.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
